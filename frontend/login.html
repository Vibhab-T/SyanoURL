<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h2>Log In</h2>
    <div id="error-box" style="color:red"></div>

    <form id="login-form">
        <label>Username</label>
            <input type="text" id="username" required/>
        

        <label>Password</label>
            <input type="password" id="password" required />
        

        <br>
        <br>

        <button type="submit">Log In</button>
    </form>

    <p>No account? <a href="signup.html">Sign Up</a></p>

    <form id="redirect-form">
        <label for="redirect-link">Enter Short URL:</label>
            <input type="text" id="redirect-link">
            <button type="submit">Redirect</button>
    </form>
</body>

<script>
    const PORT = 8000;
    const API  =`http://localhost:${PORT}/api/auth`;
    const REDIRECT = `http://localhost:${PORT}/r`;

    //if already logged in then redirect to index
    if (localStorage.getItem("access")){
        window.location.href = "index.html";
    }

    //redirect form redirection
    document.getElementById("redirect-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById("error-box");
        errorBox.textContent = '';

        window.location.href = document.getElementById("redirect-link").value;
    })

    //get the form and add the event listener to th e button
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById("error-box");
        errorBox.textContent = "";

        const body = {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
        };

        try {
            const res = await fetch(`${API}/login/`, {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });

            const data = await res.json(); //parse!

            if (!res.ok){
                errorBox.textContent = "Invalid credentials";
                return;
            }

            localStorage.setItem("access", data.access);
            localStorage.setItem("refresh", data.refresh);
            window.location.href = "index.html" //redirect to index after logging in 
        } catch (error) {
            errorBox.textContent = "Error! Something went wrong"
        }
    })
</script>
</html>
