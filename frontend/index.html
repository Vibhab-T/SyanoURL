
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
</head>
<body>
  <script>
    // Redirect to dashboard if logged in, otherwise to login
    if (localStorage.getItem("access")) {
      window.location.href = "dash.html";
    } else {
      window.location.href = "login.html";
    }
  </script>
  <p>Redirecting...</p>
</body>
</html>
